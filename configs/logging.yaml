version: 1
disable_existing_loggers: false
formatters:
  standard:
    format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  json_like:
    format: "%(asctime)s | %(levelname)s | %(name)s | %(message)s"
handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout
  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: standard
    filename: logs/pharmascope.log
    maxBytes: 10485760
    backupCount: 5
root:
  level: INFO
  handlers: [console]
loggers:
  pharmascope:
    level: INFO
    handlers: [console]
    propagate: false
  httpx:
    level: WARNING
  uvicorn:
    level: INFO
