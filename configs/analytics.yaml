analytics:
  safety_signals:
    method: reporting_odds_ratio
    min_count_a: 3
    min_count_drug: 5
    min_count_event: 5
    continuity_correction: 0.5
    multiple_testing: benjamini_hochberg
    alpha: 0.05
    disclaimer: >
      Reporting Odds Ratios are exploratory disproportionality measures based
      on spontaneous reports. They do not estimate relative risk, incidence,
      or causation. Adverse-event reports do not prove that a medicine caused
      an event.

  time_series:
    default_frequency: M
    backtest_horizons: [1, 3, 6]
    metrics: [mae, rmse, mape]

  forecasting:
    baselines: [naive, seasonal_naive]
    models: [holt_winters]
    chronological_split_only: true

  anomaly_detection:
    methods: [robust_zscore, isolation_forest]
    contamination: 0.01
    note: >
      An anomaly flag means an observation warrants review. It does not prove
      fraud, a pricing violation, or a genuine safety event.
