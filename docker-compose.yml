services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./configs:/app/configs
    command: ["uvicorn", "pharmascope.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  dashboard:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env.example
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./configs:/app/configs
    command: ["streamlit", "run", "src/pharmascope/dashboard/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    depends_on:
      - api
